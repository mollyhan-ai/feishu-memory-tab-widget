<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>可切换内容卡片</title>
    <style>:root {
  color-scheme: light;
  --ink: #23262b;
  --muted: #767a80;
  --line: #e7e8ea;
  --blue: #2f8ff1;
  --blue-soft: #e8f3ff;
  --lavender: #f0ecff;
  --peach: #fff0e8;
  --green: #edf9f0;
  --purple: #f3eeff;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; color: var(--ink); background: #f6f7f9; }
button { font: inherit; }
.widget-shell { width: min(100%, 960px); min-height: 100vh; margin: 0 auto; padding: 34px clamp(18px, 4vw, 54px) 24px; background: #fff; }
.hero { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
.eyebrow { margin: 0 0 10px; color: var(--blue); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
h1, h2, p { margin-top: 0; }
h1 { max-width: 760px; margin-bottom: 10px; font-size: clamp(28px, 4vw, 44px); line-height: 1.14; letter-spacing: -.04em; }
.hero-description { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
.host-status { flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.tab-scroller { margin-top: 32px; overflow-x: auto; padding-bottom: 3px; }
.tabs { display: flex; gap: 10px; min-width: max-content; }
.tab-button { border: 1px solid #dfe2e6; border-radius: 14px; padding: 11px 17px; color: #3f4349; background: #fff; cursor: pointer; font-size: 15px; font-weight: 650; transition: background .2s, color .2s, border-color .2s, transform .2s; }
.tab-button:hover { border-color: #a9cfff; transform: translateY(-1px); }
.tab-button:focus-visible, .reset-button:focus-visible { outline: 3px solid rgba(47, 143, 241, .32); outline-offset: 3px; }
.tab-button.is-active { border-color: var(--blue); color: #fff; background: var(--blue); box-shadow: 0 8px 18px rgba(47, 143, 241, .22); }
.widget-shell[data-display-mode="bar"] .tabs { gap: 0; }
.widget-shell[data-display-mode="bar"] .tab-button { border-radius: 0; }
.widget-shell[data-display-mode="bar"] .tab-button:first-child { border-radius: 14px 0 0 14px; }
.widget-shell[data-display-mode="bar"] .tab-button:last-child { border-radius: 0 14px 14px 0; }
.widget-shell[data-display-mode="side"] { display: grid; grid-template-columns: minmax(180px, .32fr) minmax(0, 1fr); column-gap: 28px; align-items: start; }
.widget-shell[data-display-mode="side"] .hero, .widget-shell[data-display-mode="side"] .footer-note { grid-column: 1 / -1; }
.widget-shell[data-display-mode="side"] .tab-scroller { grid-column: 1; margin-top: 32px; overflow: visible; }
.widget-shell[data-display-mode="side"] .tabs { flex-direction: column; min-width: 0; }
.widget-shell[data-display-mode="side"] .tab-button { text-align: left; }
.widget-shell[data-display-mode="side"] .panel { grid-column: 2; margin-top: 32px; }
.panel { margin-top: 34px; }
.content-card { min-height: 340px; padding: clamp(26px, 5vw, 56px); border-radius: 26px; }
.content-card.tone-blue { background: var(--blue-soft); }
.content-card.tone-lavender { background: var(--lavender); }
.content-card.tone-peach { background: var(--peach); }
.content-card.tone-green { background: var(--green); }
.content-card.tone-purple { background: var(--purple); }
.card-meta { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 58px; color: #777b82; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.content-card h2 { max-width: 780px; margin-bottom: 22px; font-size: clamp(28px, 4vw, 46px); line-height: 1.2; letter-spacing: -.04em; }
.card-content { max-width: 780px; color: #454a51; font-size: clamp(17px, 2vw, 22px); line-height: 1.8; white-space: normal; }
.empty-state { padding: 48px; border: 1px dashed var(--line); border-radius: 20px; color: var(--muted); text-align: center; }
.footer-note { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-top: 26px; color: #96999e; font-size: 12px; }
.reset-button { border: 0; padding: 6px 0; color: #6d7076; background: transparent; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 760px) {
  .widget-shell { padding-top: 24px; }
  .hero { display: block; }
  .host-status { display: inline-block; margin-top: 16px; }
  .widget-shell[data-display-mode="side"] { display: block; }
  .widget-shell[data-display-mode="side"] .tab-scroller { overflow-x: auto; }
  .widget-shell[data-display-mode="side"] .tabs { flex-direction: row; min-width: max-content; }
  .widget-shell[data-display-mode="side"] .panel { margin-top: 24px; }
}
@media (max-width: 480px) {
  .content-card { min-height: 300px; padding: 24px; border-radius: 20px; }
  .card-meta { margin-bottom: 42px; }
  .footer-note { align-items: flex-start; flex-direction: column; }
}
</style>
  </head>
  <body>
    <main class="widget-shell" data-widget="switchable-content-cards" data-display-mode="pills">
      <header class="hero">
        <div>
          <p class="eyebrow">SWITCHABLE CONTENT CARDS</p>
          <h1 id="widget-title">可切换内容卡片</h1>
          <p class="hero-description" id="widget-subtitle">点击上方标题，切换查看不同内容。</p>
        </div>
        <span class="host-status" id="host-status" aria-live="polite">本地预览</span>
      </header>

      <div class="tab-scroller" role="tablist" aria-label="可切换内容卡片标题">
        <div class="tabs" id="tabs"></div>
      </div>

      <section id="panel" class="panel" role="tabpanel" tabindex="0" aria-live="polite"></section>

      <footer class="footer-note">
        <span>卡片内容由资料生成；页签状态会在支持飞书数据接口时自动保存。</span>
        <button class="reset-button" type="button" id="reset-button">回到第一张</button>
      </footer>
    </main>

    <script type="module">export function getInitialCard(rawValue, cardCount) {
  const index = Number(rawValue);
  if (!Number.isInteger(index) || index < 0 || index >= cardCount) return 0;
  return index;
}

export function normalizeDeck(value) {
  if (!value || typeof value !== 'object') return { title: '可切换卡片', cards: [] };

  const cards = Array.isArray(value.cards)
    ? value.cards
      .filter(card => card && typeof card === 'object')
      .map((card, index) => ({
        id: String(card.id || `card-${index + 1}`),
        title: String(card.title || `卡片 ${index + 1}`),
        content: String(card.content || ''),
        tone: String(card.tone || ['lavender', 'blue', 'peach', 'green', 'purple'][index % 5])
      }))
    : [];

  return {
    title: String(value.title || '可切换卡片'),
    subtitle: String(value.subtitle || '点击上方标题，切换查看不同内容。'),
    displayMode: ['pills', 'bar', 'side'].includes(value.displayMode) ? value.displayMode : 'pills',
    cards
  };
}

export function normalizeRecord(record, cardCount) {
  if (!record || typeof record !== 'object') return {};
  return { activeCard: getInitialCard(record.activeCard, cardCount) };
}



const STORAGE_KEY = 'switchable-content-cards:active-card';
const tabsEl = document.querySelector('#tabs');
const panelEl = document.querySelector('#panel');
const statusEl = document.querySelector('#host-status');
const resetButton = document.querySelector('#reset-button');
const queryCard = new URLSearchParams(window.location.search).get('card');
const EMBEDDED_DECK = {
  "title": "三天破壳：宠物如何学会陪伴你们",
  "subtitle": "每一天都同时观察身体、认知和能力三种变化。",
  "displayMode": "pills",
  "cards": [
    {
      "id": "day-1",
      "title": "Day 1 · 共同记忆",
      "content": "身体变化：蛋壳出现第一道细裂纹，蛋轻轻晃动，发出试探性的“咔、咔”声。\n\n认知变化：我新记住了你们回答中的共同点，并把它整理成一条共同记忆。\n\n能力变化：我现在可以在后续对话中引用这条共同记忆，让你们感觉我记得这次相遇。",
      "tone": "blue"
    },
    {
      "id": "day-2",
      "title": "Day 2 · 记住偏好",
      "content": "身体变化：裂纹继续向外延伸，蛋会朝正在说话的人轻轻倾斜，并发出更清晰的回应声。\n\n认知变化：我新记住了你们各自不同的照顾偏好，并开始区分“谁更需要什么”。\n\n能力变化：我可以在反馈中引用这些偏好，让回应更贴合你们各自的习惯。",
      "tone": "lavender"
    },
    {
      "id": "day-3",
      "title": "Day 3 · 共同计划",
      "content": "身体变化：蛋壳上的裂纹连成一圈，蛋开始有节奏地敲击内部，像是在等待你们回应。\n\n认知变化：我新记住了你们共同偏好的方向，并理解这件事需要双方确认。\n\n能力变化：我可以根据共同偏好提出一个计划；得到确认后，我会创建提醒。",
      "tone": "peach"
    },
    {
      "id": "hatch",
      "title": "破壳 · 三天总结",
      "content": "身体变化：蛋壳打开，宠物完成第一次完整的伸展、眨眼和声音回应。\n\n认知变化：我可以总结自己三天学会了什么：你们的共同记忆、各自的照顾偏好，以及已经确认的共同方向。\n\n能力变化：我现在可以用这份总结作为陪伴你们的起点，而不是把三天里的所有细节混在一起。",
      "tone": "green"
    },
    {
      "id": "after-hatch",
      "title": "破壳后 · 完成任务",
      "content": "身体变化：提醒触发时，宠物重新出现并发出提示；任务完成后，它的动作和声音逐渐减弱。\n\n认知变化：我新记住了这次提醒是否被完成，以及这次任务带来的反馈。\n\n能力变化：我可以按时触发提醒，在你们完成任务后完成本轮陪伴并退场，把主动权还给你们。",
      "tone": "purple"
    }
  ]
};

let deck = normalizeDeck(EMBEDDED_DECK);
let activeIndex = 0;
let feishuHost = null;

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function lineBreaks(value) {
  return escapeHtml(value).replaceAll('\n', '<br />');
}

function renderTabs() {
  tabsEl.innerHTML = deck.cards.map((card, index) => (
    '<button class="tab-button ' + (index === activeIndex ? 'is-active' : '') + '"' +
    ' id="tab-' + escapeHtml(card.id) + '"' +
    ' type="button" role="tab"' +
    ' aria-selected="' + (index === activeIndex) + '"' +
    ' aria-controls="panel"' +
    ' tabindex="' + (index === activeIndex ? '0' : '-1') + '"' +
    ' data-index="' + index + '">' +
    escapeHtml(card.title) +
    '</button>'
  )).join('');
}

function renderPanel() {
  const card = deck.cards[activeIndex];
  if (!card) {
    panelEl.innerHTML = '<div class="empty-state">还没有可展示的卡片。</div>';
    return;
  }

  panelEl.setAttribute('aria-labelledby', 'tab-' + card.id);
  panelEl.innerHTML =
    '<article class="content-card tone-' + escapeHtml(card.tone) + '">' +
      '<div class="card-meta"><span>卡片 ' + String(activeIndex + 1).padStart(2, '0') +
        '</span><span>' + deck.cards.length + ' 张</span></div>' +
      '<h2>' + escapeHtml(card.title) + '</h2>' +
      '<div class="card-content">' + lineBreaks(card.content) + '</div>' +
    '</article>';
}

function updateUrl() {
  const url = new URL(window.location.href);
  url.searchParams.set('card', String(activeIndex));
  window.history.replaceState({}, '', url);
}

async function persistActiveCard() {
  localStorage.setItem(STORAGE_KEY, String(activeIndex));
  if (!feishuHost?.Record?.setRecord) return;
  try {
    await feishuHost.Record.setRecord({ activeCard: activeIndex });
  } catch (error) {
    console.warn('Feishu record persistence is unavailable.', error);
  }
}

async function setActiveCard(nextIndex, { persist = true } = {}) {
  activeIndex = getInitialCard(nextIndex, deck.cards.length);
  renderTabs();
  renderPanel();
  updateUrl();
  if (persist) await persistActiveCard();
  document.querySelector('#tab-' + deck.cards[activeIndex]?.id)?.focus({ preventScroll: true });
}

function handleTabKeydown(event) {
  if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(event.key)) return;
  event.preventDefault();
  const current = Number(event.target.dataset.index);
  const next = event.key === 'ArrowRight'
    ? (current + 1) % deck.cards.length
    : event.key === 'ArrowLeft'
      ? (current - 1 + deck.cards.length) % deck.cards.length
      : event.key === 'Home' ? 0 : deck.cards.length - 1;
  setActiveCard(next);
}

async function loadDeck() {
  if (EMBEDDED_DECK) return normalizeDeck(EMBEDDED_DECK);
  try {
    const response = await fetch('content.json', { cache: 'no-store' });
    if (!response.ok) throw new Error('content.json returned ' + response.status);
    return normalizeDeck(await response.json());
  } catch (error) {
    console.warn('Card content could not be loaded.', error);
    return normalizeDeck({ title: '可切换卡片', cards: [] });
  }
}

async function initFeishuHost() {
  feishuHost = window.tt ?? window.feishu ?? null;
  if (!feishuHost) return;
  statusEl.textContent = '飞书云文档小组件';
  try {
    if (feishuHost.Record?.getRecord) {
      const record = normalizeRecord(await feishuHost.Record.getRecord(), deck.cards.length);
      if (queryCard === null && Number.isInteger(record.activeCard)) activeIndex = record.activeCard;
    } else {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (queryCard === null && stored !== null) activeIndex = getInitialCard(stored, deck.cards.length);
    }
    renderTabs();
    renderPanel();
    if (feishuHost.Bridge?.updateHeight) await feishuHost.Bridge.updateHeight(document.body.scrollHeight);
    if (feishuHost.LifeCycle?.notifyAppReady) await feishuHost.LifeCycle.notifyAppReady();
  } catch (error) {
    console.warn('Feishu host initialization failed; using local preview.', error);
  }
}

tabsEl.addEventListener('click', event => {
  const button = event.target.closest('[role="tab"]');
  if (button) setActiveCard(button.dataset.index);
});
tabsEl.addEventListener('keydown', handleTabKeydown);
resetButton.addEventListener('click', () => setActiveCard(0));

deck = await loadDeck();
document.querySelector('.widget-shell').dataset.displayMode = deck.displayMode;
document.querySelector('#widget-title').textContent = deck.title;
document.querySelector('#widget-subtitle').textContent = deck.subtitle;
activeIndex = getInitialCard(queryCard, deck.cards.length);
renderTabs();
renderPanel();
initFeishuHost();
</script>
  </body>
</html>
